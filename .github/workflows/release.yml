name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publier la release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Le tag correspond à module.prop
        id: ver
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME != version=$PROP_VERSION dans module.prop"
            exit 1
          fi
          echo "version=$PROP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (build.sh)
        run: bash build.sh "${{ steps.ver.outputs.version }}"

      - name: Notes de release (extraites de CHANGELOG.md)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## CarOS Profile Switcher v${VERSION}"
            echo
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { on=1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
            cat <<EOT

          ### Installation
          1. Télécharger le ZIP ci-dessous
          2. Magisk → Modules → Installer depuis le stockage
          3. Choisir le ZIP puis redémarrer

          Configuration : \`/sdcard/CarOS/config.env\` (voir [EXAMPLES.md](https://github.com/${REPO}/blob/main/EXAMPLES.md)).

          **Prérequis** : Magisk v20.4+, Android Auto, accès root.
          EOT
          } > release-notes.md
          cat release-notes.md

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*.zip
          body_path: release-notes.md
          fail_on_unmatched_files: true
